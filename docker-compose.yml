# Full stack: Sentinel app + PostgreSQL (runs, decisions, predictions) + MLflow tracking/registry server.
#   docker compose up --build        then open http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 3s
      retries: 20

  mlflow:
    build: .
    image: sentinel-ml:local
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://sentinel:sentinel@db:5432/sentinel
      --artifacts-destination /mlartifacts --serve-artifacts
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/health"]
      interval: 10s
      retries: 12
    volumes: [mlartifacts:/mlartifacts]
    ports: ["5000:5000"]

  app:
    build: .
    image: sentinel-ml:local
    depends_on:
      db: {condition: service_healthy}
      mlflow: {condition: service_started}
    environment:
      DATABASE_URL: postgresql+psycopg2://sentinel:sentinel@db:5432/sentinel
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SENTINEL_DATA: /app/data
      SENTINEL_RUNS: /app/runs
      SENTINEL_DOCKER_HOST: host.docker.internal
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/mode"]
      interval: 10s
      retries: 12
    volumes:
      - ./data:/app/data
      - runs:/app/runs
      # Docker socket: only the Deploy tab's container smoke test needs it, and it is off by default.
      # Turn it on with DOCKER_SOCK=/var/run/docker.sock (see docker-compose.smoke.yml, which also runs the
      # app as root so it can reach the socket). Without it the Deploy step still writes and parity-tests the service.
      - ${DOCKER_SOCK:-/dev/null}:/var/run/docker.sock
    ports: ["8000:8000"]

volumes:
  pgdata:
  mlartifacts:
  runs:
