[project]
name = "sentinel-ml"
version = "0.1.0"
description = "Deterministic AutoML + MLOps copilot for predictive maintenance"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sentinel", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
