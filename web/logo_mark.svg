<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Outer measurement ring -->
  <circle cx="32" cy="32" r="28" stroke="#101418" stroke-width="1.75"/>
  <circle cx="32" cy="32" r="23" stroke="#5B6670" stroke-width="0.75" stroke-dasharray="1 3"/>
  <!-- Middle concentric calibration ring -->
  <circle cx="32" cy="32" r="16" stroke="#101418" stroke-width="1.25"/>
  <circle cx="32" cy="32" r="10" stroke="#5B6670" stroke-width="0.75"/>
  <!-- Cardinal alignment crosshairs -->
  <line x1="32" y1="2" x2="32" y2="12" stroke="#101418" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="32" y1="52" x2="32" y2="62" stroke="#101418" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="2" y1="32" x2="12" y2="32" stroke="#101418" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="52" y1="32" x2="62" y2="32" stroke="#101418" stroke-width="1.5" stroke-linecap="square"/>
  <!-- Center sensing focal point (Signal Red) -->
  <circle cx="32" cy="32" r="3.75" fill="#D8001B"/>
</svg>